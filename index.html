<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMAO — Gestion de Maintenance</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F5F4F1; --surface: #FFFFFF; --surface2: #F0EFE9;
    --border: rgba(0,0,0,0.10); --border2: rgba(0,0,0,0.18);
    --text: #1A1A18; --text2: #6B6B66; --text3: #A0A09A;
    --accent: #1D9E75; --accent-light: #E1F5EE; --accent-dark: #0F6E56;
    --radius: 10px; --radius-sm: 6px;
  }
  body { font-family:'DM Sans',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; font-size:14px; }

  /* TOPBAR */
  .topbar { background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 1.5rem; height:54px; position:sticky; top:0; z-index:200; gap:1rem; }
  .logo { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:600; white-space:nowrap; }
  .logo-icon { width:30px; height:30px; background:var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; }
  .logo-sub { font-size:11px; font-weight:400; color:var(--text3); font-family:'DM Mono',monospace; margin-left:2px; }
  .nav { display:flex; gap:2px; overflow-x:auto; }
  .nav-btn { background:none; border:none; padding:7px 14px; border-radius:var(--radius-sm); font-size:13px; font-family:inherit; cursor:pointer; color:var(--text2); display:flex; align-items:center; gap:6px; white-space:nowrap; transition:all .15s; }
  .nav-btn:hover { background:var(--surface2); color:var(--text); }
  .nav-btn.active { background:var(--surface2); color:var(--text); font-weight:500; }
  .notif-badge { background:#E24B4A; color:#fff; font-size:9px; font-weight:600; min-width:16px; height:16px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; padding:0 4px; }

  /* SYNC INDICATOR */
  .sync-dot { width:8px; height:8px; border-radius:50%; background:#A0A09A; display:inline-block; margin-left:6px; transition:background .3s; }
  .sync-dot.ok { background:#1D9E75; }
  .sync-dot.loading { background:#EF9F27; animation:pulse 1s infinite; }
  .sync-dot.error { background:#E24B4A; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* MAIN */
  .main { padding:1.5rem; max-width:1440px; margin:0 auto; }
  .page { display:none; }
  .page.active { display:block; }
  .section-title { font-size:16px; font-weight:600; margin-bottom:1rem; display:flex; align-items:center; gap:8px; }
  .section-title i { color:var(--accent); font-size:18px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1.25rem; }

  /* FORM */
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
  .form-group { display:flex; flex-direction:column; gap:5px; }
  .form-group.full { grid-column:1/-1; }
  label { font-size:11px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; }
  input,select,textarea { font-family:inherit; font-size:13.5px; padding:9px 11px; border:1px solid var(--border2); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); outline:none; transition:border .15s,box-shadow .15s; }
  input:focus,select:focus,textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(29,158,117,.12); }
  textarea { resize:vertical; min-height:80px; line-height:1.5; }
  .priority-selector { display:flex; gap:8px; flex-wrap:wrap; }
  .priority-opt { padding:6px 14px; border-radius:20px; font-size:12px; font-weight:500; cursor:pointer; border:1.5px solid transparent; transition:all .15s; opacity:.45; user-select:none; }
  .priority-opt.sel { opacity:1; }
  .priority-opt[data-p="basse"]   { background:#EAF3DE; color:#3B6D11; border-color:#C0DD97; }
  .priority-opt[data-p="normale"] { background:#E6F1FB; color:#185FA5; border-color:#B5D4F4; }
  .priority-opt[data-p="haute"]   { background:#FAEEDA; color:#854F0B; border-color:#FAC775; }
  .priority-opt[data-p="urgente"] { background:#FCEBEB; color:#A32D2D; border-color:#F7C1C1; }

  /* BUTTONS */
  .btn { font-family:inherit; font-size:13px; font-weight:500; padding:8px 16px; border-radius:var(--radius-sm); cursor:pointer; transition:all .15s; border:1px solid var(--border2); background:var(--surface); color:var(--text); display:inline-flex; align-items:center; gap:6px; }
  .btn:hover { background:var(--surface2); }
  .btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn-primary:hover { background:var(--accent-dark); }
  .btn-danger { background:#E24B4A; border-color:#E24B4A; color:#fff; }
  .btn-danger:hover { background:#A32D2D; }
  .btn-sm { padding:5px 10px; font-size:12px; }

  /* BADGES */
  .badge { display:inline-flex; align-items:center; padding:2px 8px; border-radius:12px; font-size:10px; font-weight:600; white-space:nowrap; }
  .badge-basse    { background:#EAF3DE; color:#3B6D11; }
  .badge-normale  { background:#E6F1FB; color:#185FA5; }
  .badge-haute    { background:#FAEEDA; color:#854F0B; }
  .badge-urgente  { background:#FCEBEB; color:#A32D2D; }
  .badge-encours  { background:#E6F1FB; color:#185FA5; }
  .badge-termine  { background:#EAF3DE; color:#3B6D11; }
  .badge-replanifier { background:#FAEEDA; color:#854F0B; }
  .badge-atraiter { background:#F1EFE8; color:#5F5E5A; }

  /* DEMANDS */
  .demand-list { display:flex; flex-direction:column; gap:8px; margin-top:1.5rem; }
  .demand-item { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; display:flex; align-items:center; gap:12px; transition:border .15s; }
  .demand-item:hover { border-color:var(--border2); }
  .demand-urgente { border-left:3px solid #E24B4A; }
  .demand-haute   { border-left:3px solid #EF9F27; }
  .demand-normale { border-left:3px solid #378ADD; }
  .demand-basse   { border-left:3px solid #639922; }

  /* PLANNING */
  .planning-layout { display:grid; grid-template-columns:290px 1fr; gap:1rem; align-items:start; }
  .task-list-col { position:sticky; top:70px; }
  .task-pool { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:.75rem; min-height:200px; max-height:calc(100vh - 160px); overflow-y:auto; display:flex; flex-direction:column; gap:7px; }
  .task-item { border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; cursor:grab; background:var(--surface); transition:all .15s; user-select:none; }
  .task-item:hover { border-color:var(--accent); box-shadow:0 2px 8px rgba(29,158,117,.1); }
  .task-item.dragging { opacity:.35; }
  .task-item-title { font-size:13px; font-weight:500; margin-bottom:5px; line-height:1.3; }
  .task-item-meta { font-size:11px; color:var(--text2); display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .planners-grid { display:flex; flex-direction:column; gap:.75rem; }
  .planner-col { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  .planner-header { padding:.75rem 1rem; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
  .tech-avatar { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; flex-shrink:0; }
  .planner-slots { padding:.75rem; display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .slot-cell { border:1.5px dashed var(--border2); border-radius:var(--radius-sm); min-height:64px; padding:4px; transition:all .15s; display:flex; flex-direction:column; gap:4px; }
  .slot-cell.dragover { border-color:var(--accent); background:var(--accent-light); }
  .slot-label { font-size:10px; color:var(--text3); padding:2px 4px; font-weight:500; }
  .slot-task { background:var(--surface2); border:1px solid var(--border); border-radius:4px; padding:5px 6px; font-size:11px; cursor:pointer; transition:all .15s; position:relative; }
  .slot-task:hover { border-color:var(--accent); background:var(--accent-light); }
  .slot-task-title { font-weight:500; margin-bottom:3px; line-height:1.3; padding-right:14px; }
  .slot-task-remove { position:absolute; top:3px; right:4px; background:none; border:none; cursor:pointer; font-size:13px; color:var(--text3); line-height:1; padding:0; }
  .slot-task-remove:hover { color:#E24B4A; }

  /* TECH VIEW */
  .tech-selector { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:1rem; }
  .tech-btn { padding:7px 16px; border-radius:20px; border:1px solid var(--border2); background:var(--surface); cursor:pointer; font-size:13px; font-family:inherit; font-weight:500; color:var(--text2); transition:all .15s; display:flex; align-items:center; gap:8px; }
  .tech-btn:hover { background:var(--surface2); color:var(--text); }
  .tech-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .tech-planning-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .tech-day-col { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  .tech-day-header { background:var(--surface2); padding:8px 10px; font-size:12px; font-weight:600; text-align:center; border-bottom:1px solid var(--border); }
  .tech-day-tasks { padding:8px; display:flex; flex-direction:column; gap:6px; min-height:60px; }
  .tech-task-card { border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px; transition:all .15s; background:var(--surface); }
  .tech-task-card:hover { border-color:var(--accent); box-shadow:0 2px 8px rgba(29,158,117,.08); }
  .tech-task-title { font-size:12px; font-weight:600; margin-bottom:4px; line-height:1.3; }
  .tech-task-meta { font-size:11px; color:var(--text2); margin-bottom:8px; }
  .status-btns { display:flex; gap:4px; flex-wrap:wrap; }
  .status-btn { font-family:inherit; padding:3px 9px; border-radius:4px; font-size:10px; font-weight:600; cursor:pointer; border:1px solid; transition:all .15s; }
  .status-btn:hover { opacity:.75; }
  .s-encours   { background:#E6F1FB; color:#185FA5; border-color:#B5D4F4; }
  .s-termine   { background:#EAF3DE; color:#3B6D11; border-color:#C0DD97; }
  .s-replanifier { background:#FAEEDA; color:#854F0B; border-color:#FAC775; }

  /* NOTIFS */
  .notif-list { display:flex; flex-direction:column; gap:8px; }
  .notif-item { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; display:flex; gap:12px; align-items:flex-start; }
  .notif-item.unread { border-left:3px solid var(--accent); }
  .notif-icon { width:36px; height:36px; border-radius:50%; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .notif-body { flex:1; }
  .notif-title { font-size:13px; font-weight:600; margin-bottom:3px; }
  .notif-desc { font-size:12px; color:var(--text2); line-height:1.5; white-space:pre-line; }
  .notif-time { font-size:11px; color:var(--text3); margin-top:4px; font-family:'DM Mono',monospace; }
  .notif-mark { background:none; border:none; cursor:pointer; font-size:11px; color:var(--text2); padding:2px 6px; border-radius:4px; font-family:inherit; margin-top:4px; }
  .notif-mark:hover { background:var(--surface2); }

  /* STATS */
  .stats-bar { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:1.25rem; }
  .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; }
  .stat-label { font-size:11px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:.4px; margin-bottom:4px; }
  .stat-value { font-size:22px; font-weight:600; font-family:'DM Mono',monospace; }

  /* MODAL */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; z-index:999; padding:1rem; backdrop-filter:blur(2px); }
  .modal-box { background:var(--surface); border-radius:var(--radius); border:1px solid var(--border2); width:100%; max-width:480px; padding:1.75rem; box-shadow:0 20px 60px rgba(0,0,0,.15); }
  .modal-title { font-size:16px; font-weight:600; margin-bottom:1rem; display:flex; align-items:center; gap:8px; }
  .modal-title i { color:var(--accent); }
  .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:1.25rem; }

  /* TOAST */
  #toast { position:fixed; bottom:24px; right:24px; max-width:360px; background:var(--surface); border:1px solid var(--border2); border-radius:var(--radius); padding:14px 18px; font-size:12px; line-height:1.6; box-shadow:0 8px 30px rgba(0,0,0,.12); z-index:9999; transition:opacity .3s; display:none; white-space:pre-line; }
  #toast.visible { display:block; }
  #toast-title { font-weight:600; font-size:13px; margin-bottom:4px; color:var(--accent); }

  .empty-state { text-align:center; padding:2rem 1rem; color:var(--text3); font-size:13px; }
  .empty-state i { font-size:32px; display:block; margin-bottom:.5rem; }

  /* LOADING OVERLAY */
  #loading-overlay { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; gap:1rem; }
  .spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }

  @media(max-width:900px){
    .planning-layout{grid-template-columns:1fr}
    .tech-planning-grid{grid-template-columns:repeat(2,1fr)}
    .stats-bar{grid-template-columns:repeat(2,1fr)}
    .form-grid{grid-template-columns:1fr}
    .form-group.full{grid-column:1}
  }
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading-overlay">
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--text2)">Connexion à la base de données…</div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">
    <div class="logo-icon"><i class="ti ti-settings-2"></i></div>
    GMAO <span class="logo-sub">v2.0 · live</span>
    <span class="sync-dot loading" id="sync-dot" title="Synchronisation…"></span>
  </div>
  <div class="nav">
    <button class="nav-btn active" onclick="nav('demandes')"><i class="ti ti-file-plus"></i> Nouvelle demande</button>
    <button class="nav-btn" onclick="nav('planning')"><i class="ti ti-layout-kanban"></i> Planning</button>
    <button class="nav-btn" onclick="nav('technicien')"><i class="ti ti-user-check"></i> Vue technicien</button>
    <button class="nav-btn" onclick="nav('alertes')">
      <i class="ti ti-bell"></i> Alertes
      <span class="notif-badge" id="notif-count" style="display:none">0</span>
    </button>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- DEMANDES -->
  <div class="page active" id="page-demandes">
    <div class="stats-bar" id="stats-bar"></div>
    <div class="section-title"><i class="ti ti-clipboard-plus"></i> Créer une demande d'intervention</div>
    <div class="card">
      <div class="form-grid">
        <div class="form-group">
          <label>Titre de l'intervention *</label>
          <input type="text" id="f-titre" placeholder="Ex: Fuite sur circuit hydraulique…">
        </div>
        <div class="form-group">
          <label>Équipement / Localisation *</label>
          <input type="text" id="f-lieu" placeholder="Ex: Compresseur B2 – Atelier 3">
        </div>
        <div class="form-group">
          <label>Type d'intervention</label>
          <select id="f-type">
            <option>Corrective</option><option>Préventive</option>
            <option>Amélioration</option><option>Mise en conformité</option>
          </select>
        </div>
        <div class="form-group">
          <label>Demandeur</label>
          <input type="text" id="f-demandeur" placeholder="Nom du demandeur">
        </div>
        <div class="form-group full">
          <label>Priorité</label>
          <div class="priority-selector">
            <div class="priority-opt sel" data-p="basse"   onclick="selPriority(this)">🟢 Basse</div>
            <div class="priority-opt"     data-p="normale" onclick="selPriority(this)">🔵 Normale</div>
            <div class="priority-opt"     data-p="haute"   onclick="selPriority(this)">🟠 Haute</div>
            <div class="priority-opt"     data-p="urgente" onclick="selPriority(this)">🔴 Urgente</div>
          </div>
        </div>
        <div class="form-group full">
          <label>Description / Observations</label>
          <textarea id="f-desc" placeholder="Décrivez le problème…"></textarea>
        </div>
        <div class="form-group">
          <label>Date souhaitée</label>
          <input type="date" id="f-date">
        </div>
        <div class="form-group">
          <label>Contact alerteur (email)</label>
          <input type="email" id="f-email" placeholder="alerteur@entreprise.fr">
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:1.25rem;justify-content:flex-end">
        <button class="btn" onclick="resetForm()"><i class="ti ti-refresh"></i> Réinitialiser</button>
        <button class="btn btn-primary" onclick="submitForm()"><i class="ti ti-check"></i> Créer l'intervention</button>
      </div>
    </div>
    <div class="section-title" style="margin-top:1.75rem"><i class="ti ti-list"></i> Toutes les demandes</div>
    <div id="my-demands" class="demand-list"></div>
  </div>

  <!-- PLANNING -->
  <div class="page" id="page-planning">
    <div class="planning-layout">
      <div class="task-list-col">
        <div class="section-title">
          <i class="ti ti-stack-2"></i> Tâches à planifier
          <span id="tasks-count" style="font-size:12px;font-weight:400;color:var(--text3);margin-left:4px"></span>
        </div>
        <div class="task-pool" id="task-pool" ondragover="dragOver(event)" ondrop="dropToPool(event)"></div>
      </div>
      <div>
        <div class="section-title">
          <i class="ti ti-calendar-week"></i>
          Planning techniciens — semaine du <span id="week-label"></span>
        </div>
        <div class="planners-grid" id="planners-grid"></div>
      </div>
    </div>
  </div>

  <!-- TECHNICIEN -->
  <div class="page" id="page-technicien">
    <div class="section-title"><i class="ti ti-user-check"></i> Vue technicien</div>
    <div class="tech-selector" id="tech-selector"></div>
    <div class="tech-planning-grid" id="tech-planning-grid"></div>
  </div>

  <!-- ALERTES -->
  <div class="page" id="page-alertes">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem">
      <div class="section-title" style="margin-bottom:0"><i class="ti ti-bell-ringing"></i> Centre de notifications</div>
      <button class="btn btn-sm" onclick="markAllRead()"><i class="ti ti-checks"></i> Tout marquer comme lu</button>
    </div>
    <div id="notif-list-container" class="notif-list"></div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-statut" style="display:none">
  <div class="modal-box">
    <div class="modal-title"><i class="ti ti-edit"></i> Mettre à jour l'intervention</div>
    <div id="modal-task-info" style="font-size:13px;color:var(--text2);margin-bottom:1rem;padding:10px;background:var(--surface2);border-radius:var(--radius-sm)"></div>
    <div class="form-group" style="margin-bottom:.75rem">
      <label>Nouveau statut</label>
      <select id="modal-status">
        <option value="en cours">⚙️ En cours</option>
        <option value="terminé">✅ Terminé</option>
        <option value="à replanifier">🔄 À replanifier</option>
      </select>
    </div>
    <div class="form-group" id="comment-group" style="display:none">
      <label>Raison de la replanification *</label>
      <textarea id="modal-comment" placeholder="Ex: Pièce non disponible…" style="min-height:80px"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="confirmStatus()"><i class="ti ti-check"></i> Confirmer</button>
    </div>
  </div>
</div>

<div id="toast"><div id="toast-title"></div><div id="toast-body"></div></div>

<script>

const TECHS = [
  {id:'t1',name:'Marc Dupont',   initials:'MD',bg:'#B5D4F4',fg:'#0C447C'},
  {id:'t2',name:'Sophie Renard', initials:'SR',bg:'#9FE1CB',fg:'#085041'},
  {id:'t3',name:'Julien Morel',  initials:'JM',bg:'#F5C4B3',fg:'#712B13'},
  {id:'t4',name:'Fatima Alaoui', initials:'FA',bg:'#F4C0D1',fg:'#72243E'},
];

// ── STATE ───────────────────────────────────────────────────────────
let demands = [];
let assignments = [];
let notifications = [];
let currentTech = 't1';
let selectedPriority = 'basse';
let modalTaskId = null, modalTechId = null, modalDay = null;
let dragId = null, dragFrom = null;

// ── SUPABASE HELPERS ────────────────────────────────────────────────
function setSyncDot(state) {
  const d = document.getElementById('sync-dot');
  d.className = 'sync-dot ' + state;
  d.title = state === 'ok' ? 'Synchronisé' : state === 'loading' ? 'Synchronisation…' : 'Erreur de connexion';
}

async function loadAll() {
  setSyncDot('loading');
  try {
    const [d, a, n] = await Promise.all([
      sb.from('demands').select('*').order('created_at', {ascending:false}),
      sb.from('assignments').select('*'),
      sb.from('notifications').select('*').order('id', {ascending:false}),
    ]);
    demands      = d.data || [];
    assignments  = a.data || [];
    notifications= n.data || [];
    setSyncDot('ok');
    refreshAll();
  } catch(e) {
    setSyncDot('error');
    showToast('⚠️ Erreur', 'Impossible de charger les données.');
  }
  document.getElementById('loading-overlay').style.display = 'none';
}

// Realtime subscriptions
function subscribeRealtime() {
  sb.channel('gmao-changes')
    .on('postgres_changes', {event:'*', schema:'public', table:'demands'},      () => reloadDemands())
    .on('postgres_changes', {event:'*', schema:'public', table:'assignments'},  () => reloadAssignments())
    .on('postgres_changes', {event:'*', schema:'public', table:'notifications'},() => reloadNotifs())
    .subscribe();
}

async function reloadDemands() {
  const {data} = await sb.from('demands').select('*').order('created_at',{ascending:false});
  demands = data || [];
  renderMyDemands(); renderStats(); renderTaskPool(); renderSlotTasks(); renderTechGrid();
}
async function reloadAssignments() {
  const {data} = await sb.from('assignments').select('*');
  assignments = data || [];
  renderTaskPool(); renderSlotTasks(); renderTechGrid();
}
async function reloadNotifs() {
  const {data} = await sb.from('notifications').select('*').order('id',{ascending:false});
  notifications = data || [];
  updateNotifBadge(); renderNotifs();
}

// ── UTILS ───────────────────────────────────────────────────────────
function now() { return new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function fmtDate(d) { if(!d)return''; const p=d.split('-'); return `${p[2]}/${p[1]}/${p[0]}`; }
function getId() { return 'D' + Date.now().toString().slice(-6); }
function getWeekLabel() { return new Date(2026,4,4).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}); }

// ── NAVIGATION ──────────────────────────────────────────────────────
function nav(page) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  const idx={demandes:0,planning:1,technicien:2,alertes:3};
  document.querySelectorAll('.nav-btn')[idx[page]].classList.add('active');
  if(page==='planning')   renderPlanning();
  if(page==='technicien') renderTechView();
  if(page==='demandes')   { renderMyDemands(); renderStats(); }
  if(page==='alertes')    { renderNotifs(); markAllReadDB(); }
}

// ── STATS ───────────────────────────────────────────────────────────
function renderStats() {
  const total    = demands.length;
  const atraiter = demands.filter(d=>d.status==='à traiter').length;
  const encours  = demands.filter(d=>d.status==='en cours').length;
  const termine  = demands.filter(d=>d.status==='terminé').length;
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value">${total}</div></div>
    <div class="stat-card"><div class="stat-label">À traiter</div><div class="stat-value" style="color:#5F5E5A">${atraiter}</div></div>
    <div class="stat-card"><div class="stat-label">En cours</div><div class="stat-value" style="color:#185FA5">${encours}</div></div>
    <div class="stat-card"><div class="stat-label">Terminées</div><div class="stat-value" style="color:#3B6D11">${termine}</div></div>
  `;
}

// ── FORM ─────────────────────────────────────────────────────────────
function selPriority(el) {
  document.querySelectorAll('.priority-opt').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');
  selectedPriority = el.dataset.p;
}

function resetForm() {
  ['f-titre','f-lieu','f-demandeur','f-desc','f-date','f-email'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-type').selectedIndex=0;
  document.querySelectorAll('.priority-opt').forEach(e=>e.classList.remove('sel'));
  document.querySelector('.priority-opt[data-p="basse"]').classList.add('sel');
  selectedPriority='basse';
}

async function submitForm() {
  const titre = document.getElementById('f-titre').value.trim();
  const lieu  = document.getElementById('f-lieu').value.trim();
  if(!titre||!lieu){ showToast('Erreur','Titre et localisation sont obligatoires.'); return; }
  const d = {
    id: getId(), titre, lieu,
    type: document.getElementById('f-type').value,
    demandeur: document.getElementById('f-demandeur').value||'Anonyme',
    priority: selectedPriority,
    description: document.getElementById('f-desc').value,
    date_souhaitee: document.getElementById('f-date').value,
    email: document.getElementById('f-email').value,
    status: 'à traiter',
  };
  setSyncDot('loading');
  const {error} = await sb.from('demands').insert([d]);
  if(error){ showToast('❌ Erreur',error.message); setSyncDot('error'); return; }
  await addNotif('📋','Nouvelle demande créée',`"${d.titre}" ajoutée par ${d.demandeur}.`,true);
  setSyncDot('ok');
  showToast('✅ Créée',`L'intervention "${d.titre}" est prête à planifier.`);
  resetForm();
}

// ── DEMANDS LIST ─────────────────────────────────────────────────────
function renderMyDemands() {
  const container = document.getElementById('my-demands');
  if(!demands.length){ container.innerHTML='<div class="empty-state"><i class="ti ti-file-off"></i>Aucune demande</div>'; return; }
  container.innerHTML = demands.map(d=>{
    const hasDesc = d.description && d.description.trim();
    return `
    <div class="demand-item demand-${d.priority}">
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;margin-bottom:5px">${d.id} — ${d.titre}</div>
        <div style="font-size:12px;color:var(--text2);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:${hasDesc?'8px':'0'}">
          <span><i class="ti ti-map-pin" style="font-size:12px;vertical-align:-1px"></i> ${d.lieu}</span>
          <span>${d.type}</span><span>${fmtDate(d.date_souhaitee)||'Sans date'}</span><span>${d.demandeur}</span>
          <span class="badge badge-${d.priority}">${d.priority}</span>
          <span class="badge badge-${(d.status||'').replace(/ /g,'').replace('à','a')}">${d.status}</span>
          ${d.comment?`<span style="font-size:11px;color:#854F0B;background:#FAEEDA;padding:2px 8px;border-radius:8px">💬 ${d.comment}</span>`:''}
        </div>
        ${hasDesc ? `<div style="font-size:12px;color:var(--text2);background:var(--surface2);border-left:3px solid var(--border2);border-radius:0 4px 4px 0;padding:7px 10px;line-height:1.5"><i class="ti ti-notes" style="font-size:11px;vertical-align:-1px;margin-right:4px;color:var(--text3)"></i>${d.description}</div>` : ''}
      </div>
      <button class="btn btn-danger btn-sm" onclick="deleteDemand('${d.id}')" style="flex-shrink:0;align-self:flex-start"><i class="ti ti-trash"></i></button>
    </div>`;
  }).join('');
}

async function deleteDemand(id) {
  if(!confirm('Supprimer cette demande ?')) return;
  await sb.from('assignments').delete().eq('demand_id',id);
  await sb.from('demands').delete().eq('id',id);
}

// ── PLANNING ─────────────────────────────────────────────────────────
function getAssigned() {
  return new Set(assignments.map(a=>a.demand_id));
}

function renderPlanning() {
  document.getElementById('week-label').textContent = getWeekLabel();
  renderTaskPool();
  renderPlannerGrid();
}

function renderTaskPool() {
  const used = getAssigned();
  const pool = demands.filter(d=>!used.has(d.id)&&d.status!=='terminé');
  const container = document.getElementById('task-pool');
  container.innerHTML = '';
  document.getElementById('tasks-count').textContent = `(${pool.length})`;
  if(!pool.length){ container.innerHTML='<div class="empty-state"><i class="ti ti-circle-check"></i>Tout est planifié !</div>'; return; }
  pool.forEach(d=>{
    const el=document.createElement('div');
    el.className='task-item'; el.draggable=true; el.dataset.demandId=d.id;
    el.innerHTML=`
      <div class="task-item-title">${d.id} · ${d.titre}</div>
      <div class="task-item-meta"><span>${d.lieu}</span><span class="badge badge-${d.priority}">${d.priority}</span><span>${fmtDate(d.date_souhaitee)||'Sans date'}</span></div>`;
    el.addEventListener('dragstart',e=>{ dragId=d.id; dragFrom='pool'; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    el.addEventListener('dragend',()=>el.classList.remove('dragging'));
    container.appendChild(el);
  });
}

function renderPlannerGrid() {
  const grid = document.getElementById('planners-grid');
  grid.innerHTML = '';
  TECHS.forEach(tech=>{
    const col=document.createElement('div');
    col.className='planner-col';
    col.innerHTML=`
      <div class="planner-header">
        <div class="tech-avatar" style="background:${tech.bg};color:${tech.fg}">${tech.initials}</div>
        <div style="font-size:13px;font-weight:600">${tech.name}</div>
      </div>
      <div class="planner-slots">
        ${DAYS.map((d,i)=>`
          <div class="slot-cell" id="slot-${tech.id}-${i}"
            ondragover="dragOver(event)" ondrop="dropToSlot(event,'${tech.id}',${i})">
            <div class="slot-label">${d}</div>
          </div>`).join('')}
      </div>`;
    grid.appendChild(col);
  });
  renderSlotTasks();
}

function renderSlotTasks() {
  // Clear all slots first
  document.querySelectorAll('.slot-task').forEach(e=>e.remove());
  assignments.forEach(a=>{
    const cell=document.getElementById(`slot-${a.tech_id}-${a.day_index}`);
    if(!cell) return;
    const demand=demands.find(d=>d.id===a.demand_id);
    if(!demand) return;
    const el=document.createElement('div');
    el.className='slot-task';
    el.innerHTML=`
      <button class="slot-task-remove" onclick="removeFromSlot('${a.tech_id}',${a.day_index},'${a.demand_id}')" title="Remettre dans la liste">×</button>
      <div class="slot-task-title">${demand.titre.substring(0,26)}${demand.titre.length>26?'…':''}</div>
      <span class="badge badge-${demand.priority}">${demand.priority}</span>`;
    cell.appendChild(el);
  });
}

function dragOver(e) { e.preventDefault(); e.currentTarget.classList.add('dragover'); }

async function dropToSlot(e, techId, day) {
  e.preventDefault();
  document.querySelectorAll('.slot-cell').forEach(c=>c.classList.remove('dragover'));
  if(!dragId) return;
  // Check not already assigned here
  const exists = assignments.find(a=>a.demand_id===dragId&&a.tech_id===techId&&a.day_index===day);
  if(exists) return;
  // Remove from old slot if dragged from another slot
  if(dragFrom && dragFrom!=='pool') {
    const [oldTech, oldDay] = dragFrom.split('-');
    await sb.from('assignments').delete().eq('demand_id',dragId).eq('tech_id',oldTech).eq('day_index',parseInt(oldDay));
  }
  setSyncDot('loading');
  await sb.from('assignments').insert([{demand_id:dragId, tech_id:techId, day_index:day}]);
  const d=demands.find(x=>x.id===dragId);
  const tech=TECHS.find(t=>t.id===techId);
  if(d&&tech) await addNotif('📅','Intervention planifiée',`"${d.titre}" assignée à ${tech.name} — ${DAYS_FULL[day]}.`,true);
  setSyncDot('ok');
  dragId=null; dragFrom=null;
}

async function dropToPool(e) {
  e.preventDefault();
  document.querySelectorAll('.slot-cell').forEach(c=>c.classList.remove('dragover'));
  if(!dragId||dragFrom==='pool') return;
  if(dragFrom) {
    const [oldTech,oldDay]=dragFrom.split('-');
    await sb.from('assignments').delete().eq('demand_id',dragId).eq('tech_id',oldTech).eq('day_index',parseInt(oldDay));
  }
  dragId=null; dragFrom=null;
}

async function removeFromSlot(techId, day, demandId) {
  await sb.from('assignments').delete().eq('demand_id',demandId).eq('tech_id',techId).eq('day_index',day);
}

// ── TECH VIEW ─────────────────────────────────────────────────────────
function renderTechView() {
  const sel=document.getElementById('tech-selector');
  sel.innerHTML=TECHS.map(t=>`
    <button class="tech-btn ${t.id===currentTech?'active':''}" onclick="selectTech('${t.id}')">
      <span style="display:inline-flex;width:22px;height:22px;border-radius:50%;background:${t.bg};color:${t.fg};align-items:center;justify-content:center;font-size:10px;font-weight:700">${t.initials}</span>
      ${t.name}
    </button>`).join('');
  renderTechGrid();
}

function selectTech(id) { currentTech=id; renderTechView(); }

function renderTechGrid() {
  const tech=TECHS.find(t=>t.id===currentTech);
  const grid=document.getElementById('tech-planning-grid');
  grid.innerHTML=DAYS.map((d,i)=>{
    const dayAssignments=assignments.filter(a=>a.tech_id===tech.id&&a.day_index===i);
    return `
      <div class="tech-day-col">
        <div class="tech-day-header">${DAYS_FULL[i]}</div>
        <div class="tech-day-tasks">
          ${dayAssignments.length===0
            ?`<div style="font-size:11px;color:var(--text3);text-align:center;padding:.75rem"><i class="ti ti-coffee" style="display:block;font-size:20px;margin-bottom:4px"></i>Libre</div>`
            :dayAssignments.map(a=>{
              const dem=demands.find(d=>d.id===a.demand_id);
              if(!dem) return '';
              return `
                <div class="tech-task-card">
                  <div class="tech-task-title">${dem.titre}</div>
                  <div class="tech-task-meta"><i class="ti ti-map-pin" style="font-size:11px;vertical-align:-1px"></i> ${dem.lieu}</div>
                  <div style="margin-bottom:8px"><span class="badge badge-${dem.priority}">${dem.priority}</span></div>
                  <div class="status-btns">
                    <button class="status-btn s-encours"    onclick="quickStatus('${dem.id}','${tech.id}',${i},'en cours')">⚙️ En cours</button>
                    <button class="status-btn s-termine"    onclick="quickStatus('${dem.id}','${tech.id}',${i},'terminé')">✅ Terminé</button>
                    <button class="status-btn s-replanifier" onclick="openModal('${dem.id}','${tech.id}',${i})">🔄 Replanifier</button>
                  </div>
                </div>`;
            }).join('')
          }
        </div>
      </div>`;
  }).join('');
}

async function quickStatus(demId, techId, day, status) {
  const dem=demands.find(d=>d.id===demId);
  const tech=TECHS.find(t=>t.id===techId);
  if(!dem||!tech) return;
  setSyncDot('loading');
  await sb.from('demands').update({status}).eq('id',demId);
  if(status==='terminé') {
    await sb.from('assignments').delete().eq('demand_id',demId).eq('tech_id',techId).eq('day_index',day);
    await addNotif('✅','Intervention terminée',`"${dem.titre}" clôturée par ${tech.name}.`,true);
    simulateNotif(dem,tech,'terminé','');
  } else {
    await addNotif('⚙️','En cours',`"${dem.titre}" démarrée par ${tech.name}.`,true);
    simulateNotif(dem,tech,'en cours','');
  }
  setSyncDot('ok');
}

// ── MODAL ─────────────────────────────────────────────────────────────
function openModal(demId, techId, day) {
  modalTaskId=demId; modalTechId=techId; modalDay=day;
  const dem=demands.find(d=>d.id===demId);
  document.getElementById('modal-task-info').innerHTML=dem?`<strong>${dem.id}</strong> · ${dem.titre}<br><span style="color:var(--text3)">${dem.lieu}</span>`:'';
  document.getElementById('modal-status').value='à replanifier';
  document.getElementById('modal-comment').value='';
  document.getElementById('comment-group').style.display='block';
  document.getElementById('modal-statut').style.display='flex';
  document.getElementById('modal-status').onchange=function(){
    document.getElementById('comment-group').style.display=this.value==='à replanifier'?'block':'none';
  };
}

function closeModal() { document.getElementById('modal-statut').style.display='none'; }

async function confirmStatus() {
  const status=document.getElementById('modal-status').value;
  const comment=document.getElementById('modal-comment').value.trim();
  if(status==='à replanifier'&&!comment){ showToast('⚠️ Requis','Indiquez la raison de la replanification.'); return; }
  const dem=demands.find(d=>d.id===modalTaskId);
  const tech=TECHS.find(t=>t.id===modalTechId);
  if(!dem||!tech){ closeModal(); return; }
  setSyncDot('loading');
  await sb.from('assignments').delete().eq('demand_id',modalTaskId).eq('tech_id',modalTechId).eq('day_index',modalDay);
  if(status==='terminé') {
    await sb.from('demands').update({status:'terminé'}).eq('id',modalTaskId);
    await addNotif('✅','Terminée',`"${dem.titre}" clôturée par ${tech.name}.`,true);
    simulateNotif(dem,tech,'terminé','');
  } else if(status==='à replanifier') {
    await sb.from('demands').update({status:'à traiter',comment}).eq('id',modalTaskId);
    await addNotif('🔄','À replanifier',`"${dem.titre}" — ${tech.name} :\n"${comment}"`,true);
    simulateNotif(dem,tech,'à replanifier',comment);
  } else {
    await sb.from('demands').update({status:'en cours'}).eq('id',modalTaskId);
    await addNotif('⚙️','En cours',`"${dem.titre}" démarrée par ${tech.name}.`,true);
  }
  setSyncDot('ok');
  closeModal();
}

// ── NOTIFICATIONS ─────────────────────────────────────────────────────
function simulateNotif(dem, tech, status, comment) {
  const msgs={
    'en cours':      `📧 Email → ${dem.email||'alerteur'}\n📱 SMS → +33 6 99 84 26 79\n\nSujet : EN COURS — ${dem.titre}\n${tech.name} a démarré l'intervention.`,
    'terminé':       `📧 Email → ${dem.email||'alerteur'}\n📱 SMS → +33 6 99 84 26 79\n\nSujet : TERMINÉE — ${dem.titre}\n${tech.name} a clôturé l'intervention.`,
    'à replanifier': `📧 Email → ${dem.email||'alerteur'}\n📱 SMS → +33 6 99 84 26 79\n\nSujet : À REPLANIFIER — ${dem.titre}\nMotif : "${comment}"`,
  };
  showToast('📨 Notification simulée', msgs[status]||'');
}

async function addNotif(icon, title, desc, unread) {
  await sb.from('notifications').insert([{id:Date.now(), icon, title, description:desc, unread, time:now()}]);
}

function updateNotifBadge() {
  const count=notifications.filter(n=>n.unread).length;
  const badge=document.getElementById('notif-count');
  badge.textContent=count;
  badge.style.display=count?'inline-flex':'none';
}

function renderNotifs() {
  const container=document.getElementById('notif-list-container');
  if(!notifications.length){ container.innerHTML='<div class="empty-state"><i class="ti ti-bell-off"></i>Aucune notification</div>'; return; }
  container.innerHTML=notifications.map(n=>`
    <div class="notif-item ${n.unread?'unread':''}">
      <div class="notif-icon">${n.icon}</div>
      <div class="notif-body">
        <div class="notif-title">${n.title}</div>
        <div class="notif-desc">${n.description}</div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="notif-time">${n.time}</span>
          ${n.unread?`<button class="notif-mark" onclick="markOneRead(${n.id})">Marquer lu</button>`:''}
        </div>
      </div>
    </div>`).join('');
}

async function markOneRead(id) {
  await sb.from('notifications').update({unread:false}).eq('id',id);
}

async function markAllRead() {
  await sb.from('notifications').update({unread:false}).eq('unread',true);
}
async function markAllReadDB() {
  await sb.from('notifications').update({unread:false}).eq('unread',true);
  notifications.forEach(n=>n.unread=false);
  updateNotifBadge(); renderNotifs();
}

// ── TOAST ─────────────────────────────────────────────────────────────
let toastTimer=null;
function showToast(title, body) {
  const t=document.getElementById('toast');
  document.getElementById('toast-title').textContent=title;
  document.getElementById('toast-body').textContent=body;
  t.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('visible'),5000);
}

function refreshAll() {
  renderStats(); renderMyDemands(); updateNotifBadge();
  document.getElementById('week-label') && (document.getElementById('week-label').textContent=getWeekLabel());
}

// ── INIT ─────────────────────────────────────────────────────────────
document.getElementById('modal-statut').addEventListener('click',function(e){ if(e.target===this)closeModal(); });
document.addEventListener('dragleave',function(e){ if(e.target.classList&&e.target.classList.contains('slot-cell'))e.target.classList.remove('dragover'); });

loadAll().then(()=>subscribeRealtime());
</script>
